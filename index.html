<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Talks Event Schedule</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tech Talks 2026</h1>
        <p>A day of insightful technical discussions.</p>
    </header>

    <main>
        <section class="filters">
            <input type="text" id="search-input" placeholder="Search talks by title, speaker, category...">
            <select id="category-filter">
                <option value="all">All Categories</option>
                <!-- Categories will be populated by JavaScript -->
            </select>
        </section>

        <section id="schedule-section">
            <h2>Event Schedule</h2>
            <div id="schedule">
                <!-- Schedule items will be rendered here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tech Talks Event. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
